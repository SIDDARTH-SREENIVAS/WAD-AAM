<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the Course Feedback Management System to submit student reviews or manage academic course evaluations.">
    <title>Sign In - Course Feedback Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="animate-fade-in">
    <div class="app-container">
        <!-- Header area with theme toggle -->
        <header>
            <div class="logo-section">
                <h1>Feedback Loop</h1>
                <p>Course Feedback Management System</p>
            </div>
            <div class="header-controls">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme"></button>
            </div>
        </header>

        <main class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your portal</p>
                </div>

                <!-- Dynamic Notification / Alert Containers -->
                <div id="auth-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="input-control" required placeholder="e.g. john_doe or admin" autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="input-control" required placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-full">Sign In</button>
                    </div>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Create Student Account</a>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check for registered success query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'success') {
            const alertBox = document.getElementById('auth-alert');
            if (alertBox) {
                showAlert(alertBox, 'Registration successful! You can now log in.', 'success');
            }
        }
    </script>
</body>
</html>
